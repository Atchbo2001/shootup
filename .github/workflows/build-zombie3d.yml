name: Build Shring Outbreak 3D

on:
  push:
    branches:
      - main
    paths:
      - "zombie3d/**"
      - ".github/workflows/build-zombie3d.yml"
  pull_request:
    branches:
      - main
    paths:
      - "zombie3d/**"
      - ".github/workflows/build-zombie3d.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 2.0.0
  ZIP_NAME: Shring-Outbreak-3D-v2.0.0-PTERODACTYL-FLAT.zip

jobs:
  build:
    name: Build, multiplayer-test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work/source
          : > work/source.tar.gz
          for part in zombie3d/source.part*.b64; do
            base64 --decode "$part" >> work/source.tar.gz
          done
          gzip -t work/source.tar.gz
          tar -xzf work/source.tar.gz -C work/source
          test -f work/source/package.json
          test -f work/source/server.js
          test -f work/source/public/game.js
          test -f work/source/test/smoke.mjs

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: work/source
        run: npm install --no-audit --no-fund

      - name: Run syntax validation
        working-directory: work/source
        run: npm run check

      - name: Start test server
        working-directory: work/source
        shell: bash
        run: |
          set -euo pipefail
          SERVER_HOST=127.0.0.1 \
          SERVER_PORT=31025 \
          INTERMISSION_MS=350 \
          NODE_ENV=production \
          node server.js > server-test.log 2>&1 &
          echo $! > server-test.pid

      - name: Wait for health endpoint
        working-directory: work/source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:31025/health > health.json; then
              cat health.json
              grep -q '"ok":true' health.json
              grep -q '"service":"shring-outbreak-3d"' health.json
              exit 0
            fi
            if ! kill -0 "$(cat server-test.pid)" 2>/dev/null; then
              cat server-test.log
              exit 1
            fi
            sleep 1
          done
          cat server-test.log
          echo "Health endpoint did not become ready" >&2
          exit 1

      - name: Run two-client cooperative smoke test
        working-directory: work/source
        run: npm run smoke

      - name: Stop test server
        if: always()
        working-directory: work/source
        shell: bash
        run: |
          if [ -f server-test.pid ]; then
            kill -TERM "$(cat server-test.pid)" 2>/dev/null || true
            sleep 1
            kill -KILL "$(cat server-test.pid)" 2>/dev/null || true
          fi
          cat server-test.log 2>/dev/null || true

      - name: Prepare flat production package
        shell: bash
        run: |
          set -euo pipefail
          cd work/source
          npm prune --omit=dev --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          rm -rf package
          mkdir -p package
          cp -a work/source/server.js package/
          cp -a work/source/public package/
          cp -a work/source/package.json package/
          cp -a work/source/package-lock.json package/
          cp -a work/source/start.sh package/
          cp -a work/source/README.md package/
          cp -a work/source/LICENSE package/
          cp -a work/source/THIRD_PARTY_NOTICES.md package/
          cp -a work/source/.env.example package/
          cp -a work/source/node_modules package/
          chmod +x package/start.sh
          cat > package/VERSION.json <<EOF
          {
            "version": "${RELEASE_VERSION}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "publicUrl": "https://shootup.shring.net",
            "port": 31025,
            "guestPlay": true,
            "mode": "cooperative-zombie-rounds"
          }
          EOF
          test -f package/server.js
          test -f package/public/index.html
          test -d package/node_modules/socket.io
          test -d package/node_modules/three
          du -sh package

      - name: Validate packaged runtime without installing
        shell: bash
        working-directory: package
        run: |
          set -euo pipefail
          SERVER_HOST=127.0.0.1 \
          SERVER_PORT=31026 \
          INTERMISSION_MS=350 \
          NODE_ENV=production \
          bash ./start.sh > package-test.log 2>&1 &
          PID=$!
          cleanup() {
            kill -TERM "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:31026/health > package-health.json; then
              grep -q '"ok":true' package-health.json
              curl --fail --silent http://127.0.0.1:31026/ | grep -q "Shring Outbreak"
              cat package-health.json
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat package-test.log
              exit 1
            fi
            sleep 1
          done
          cat package-test.log
          exit 1

      - name: Create upload ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ZIP_NAME" "$ZIP_NAME.sha256"
          cd package
          zip -r -6 "$GITHUB_WORKSPACE/$ZIP_NAME" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          unzip -t "$ZIP_NAME"
          stat -c 'ZIP size: %s bytes' "$ZIP_NAME"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: shring-outbreak-3d-v2.0.0
          path: |
            Shring-Outbreak-3D-v2.0.0-PTERODACTYL-FLAT.zip
            Shring-Outbreak-3D-v2.0.0-PTERODACTYL-FLAT.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish public GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Shring Outbreak 3D v2.0.0
          body: |
            First playable cooperative 3D zombie-round release for shootup.shring.net.

            Included:
            - one persistent public cooperative lobby
            - guest nicknames; no account required
            - synchronized players and server-managed zombies
            - escalating zombie rounds
            - pistol, rifle, and shotgun
            - points, ammunition, and wall weapon stations
            - downed players, teammate revives, bleed-out, and squad reset
            - health and status endpoints
            - preinstalled production dependencies for Pterodactyl Node.js 22

            This is a functional first co-op zombie release, not a claim of full Call of Duty Zombies feature parity.

            Extract directly into /home/container and start with:

            bash ./start.sh
          files: |
            Shring-Outbreak-3D-v2.0.0-PTERODACTYL-FLAT.zip
            Shring-Outbreak-3D-v2.0.0-PTERODACTYL-FLAT.zip.sha256
          fail_on_unmatched_files: true
          make_latest: true
