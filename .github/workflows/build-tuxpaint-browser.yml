name: Build Original Tux Paint for Shring Browser

on:
  push:
    branches: [main]
    paths:
      - "tuxpaint-browser/**"
      - ".github/workflows/build-tuxpaint-browser.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.8'
      - name: Build upstream original Tux Paint 0.9.35 in WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/hefi46/tuxpaint-web.git /tmp/tuxpaint-web
          git -C /tmp/tuxpaint-web checkout 635f6a86f0085066f5c513fdc1224388b5bebd96
          test "$(git -C /tmp/tuxpaint-web rev-parse HEAD)" = "635f6a86f0085066f5c513fdc1224388b5bebd96"
          cd /tmp/tuxpaint-web/tuxpaint-0.9.35/tuxpaint-0.9.35
          bash "$GITHUB_WORKSPACE/tuxpaint-browser/fix-wasm-plugins.sh"
          bash wasm/build.sh
          test -s build-wasm/tuxpaint.html
          test -s build-wasm/tuxpaint.js
          test -s build-wasm/tuxpaint.wasm
          test "$(stat -c %s build-wasm/tuxpaint.wasm)" -gt 250000
          node -e 'const fs=require("fs");const m=new WebAssembly.Module(fs.readFileSync("build-wasm/tuxpaint.wasm"));const x=WebAssembly.Module.exports(m).map(y=>y.name); console.log("WASM exports",x.slice(0,50)); if(!x.includes("main")&&!x.includes("_main")) throw Error("Native Tux Paint main is absent");'
          test -s build-wasm/tuxpaint.data
          mkdir -p "${GITHUB_WORKSPACE}/tuxpaint-package/public"
          cp build-wasm/tuxpaint.html "${GITHUB_WORKSPACE}/tuxpaint-package/public/index.html"
          cp build-wasm/tuxpaint.js build-wasm/tuxpaint.wasm build-wasm/tuxpaint.data "${GITHUB_WORKSPACE}/tuxpaint-package/public/"
          cp "${GITHUB_WORKSPACE}/tuxpaint-browser/server.mjs" "${GITHUB_WORKSPACE}/tuxpaint-package/"
          cp "${GITHUB_WORKSPACE}/tuxpaint-browser/start.sh" "${GITHUB_WORKSPACE}/tuxpaint-package/"
          cp "${GITHUB_WORKSPACE}/tuxpaint-browser/README.md" "${GITHUB_WORKSPACE}/tuxpaint-package/"
          if test -f COPYING.txt; then cp COPYING.txt "${GITHUB_WORKSPACE}/tuxpaint-package/TUXPAINT-COPYING.txt"; fi
          if test -f LICENSE.txt; then cp LICENSE.txt "${GITHUB_WORKSPACE}/tuxpaint-package/TUXPAINT-LICENSE.txt"; fi
      - name: Validate Node 22 delivery, WASM bytes and byte-range serving
        shell: bash
        run: |
          set -euo pipefail
          cd tuxpaint-package
          SERVER_PORT=31025 node server.mjs > /tmp/tuxpaint-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:31025/health > /tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json
          curl --fail --silent http://127.0.0.1:31025/ -o /tmp/tuxpaint-index.html
          grep -q "Tux Paint" /tmp/tuxpaint-index.html
          curl --fail --silent --head http://127.0.0.1:31025/tuxpaint.wasm | grep -qi 'application/wasm'
          test "$(curl --fail --silent -r 0-31 http://127.0.0.1:31025/tuxpaint.wasm | wc -c)" -eq 32
          echo "Tux Paint original browser runtime smoke test succeeded"
      - name: Verify real Tux Paint canvas in Chromium before releasing
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          cd tuxpaint-package
          SERVER_PORT=31025 node server.mjs > /tmp/tuxpaint-chromium-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:31025/health >/tmp/tuxpaint-browser-health.json; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
          const p=await b.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          p.on('console',m=>{if(m.type()==='error'||m.type()==='warning')errors.push(m.type()+': '+m.text())});
          p.on('pageerror',e=>errors.push('exception: '+(e.stack||e.message)));
          p.on('requestfailed',r=>errors.push('request: '+r.url()+' '+r.failure()?.errorText));
          try {
            const response=await p.goto('http://127.0.0.1:31025/',{waitUntil:'domcontentloaded',timeout:60000});
            if(!response?.ok()) throw Error('HTTP '+response?.status());
            await p.waitForFunction(()=>{
              const c=document.querySelector('canvas.emscripten');
              return c && c.width>=640 && c.height>=400 && !c.classList.contains('hidden');
            },null,{timeout:60000,polling:300});
            const info=await p.evaluate(()=>{
              const c=document.querySelector('canvas.emscripten');
              const s=document.getElementById('status');
              const e=document.getElementById('error-msg');
              return {width:c.width,height:c.height,status:s?.textContent,error:e?.textContent,classes:e?.className,main:typeof window.Module?._main};
            });
            console.log('Browser rendering check passed',JSON.stringify(info));
            console.log('Browser warnings',JSON.stringify(errors.slice(-50)));
            await p.screenshot({path:'tuxpaint-live-ci.png',fullPage:true});
          }catch(e){
            console.error('Native Tux Paint never painted a usable canvas',e.message);
            console.error('Browser warnings/errors',JSON.stringify(errors.slice(-50)));
            const info=await p.evaluate(()=>({
              status:document.querySelector('#status')?.innerText,
              error:document.querySelector('#error-msg')?.innerText,
              canvas:document.querySelector('canvas')?{width:document.querySelector('canvas').width,height:document.querySelector('canvas').height}:null
            })).catch(()=>({}));
            console.error('Page state',JSON.stringify(info));
            await p.screenshot({path:'tuxpaint-live-ci.png',fullPage:true}).catch(()=>{});
            throw e;
          }finally{await b.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuxpaint-0.9.35-native-browser-screenshot
          path: tuxpaint-live-ci.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Package Pterodactyl flat deploy
        shell: bash
        run: |
          set -euo pipefail
          cd tuxpaint-package
          zip -qr "${GITHUB_WORKSPACE}/Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.zip" .
          tar -czf "${GITHUB_WORKSPACE}/Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.tar.gz" .
          cd "${GITHUB_WORKSPACE}"
          sha256sum Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.zip > Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.zip.sha256
          sha256sum Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.tar.gz > Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.tar.gz.sha256
          ls -lh Shring-TuxPaint-*
      - uses: actions/upload-artifact@v4
        with:
          name: shring-tuxpaint-0.9.35-original-browser
          path: |
            Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.zip
            Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.zip.sha256
            Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.tar.gz
            Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.tar.gz.sha256
          retention-days: 30
          compression-level: 0
      - name: Publish independent public build artifact release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tuxpaint-original-wasm-0.9.35-build2
          name: Shring Tux Paint original 0.9.35 browser runtime — retained application entrypoint
          make_latest: false
          body: |
            This build explicitly retains the native Tux Paint main entrypoint and passes real-browser rendering checks. It includes original graphics, brushes and sounds. It is not a visual remake. Collaboration is not yet included. Preserve the existing Pterodactyl backup before switching Shootup over to this runtime.
          files: |
            Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.zip
            Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.zip.sha256
            Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.tar.gz
            Shring-TuxPaint-0.9.35-Browser-PTERODACTYL.tar.gz.sha256
          fail_on_unmatched_files: true
