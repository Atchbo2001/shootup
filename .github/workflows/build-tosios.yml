name: Build Shring Shooter Siege Maps

on:
  push:
    branches: [main]
    paths:
      - "tosios-builder/**"
      - ".github/workflows/build-tosios.yml"
      - "README.md"
      - "ROADMAP.md"
      - "VERSION-NEXT"
  pull_request:
    branches: [main]
    paths:
      - "tosios-builder/**"
      - ".github/workflows/build-tosios.yml"
      - "README.md"
      - "ROADMAP.md"
      - "VERSION-NEXT"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_COMMIT: 98de136e524d25c5877adc9523c9445bc2b4a262
  RELEASE_VERSION: 3.5.0
  ZIP_NAME: Shring-Shooter-Siege-Maps-v3.5.0-PTERODACTYL-FLAT.zip

jobs:
  build:
    name: Build, validate both Siege maps, run multiplayer regressions, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out Shring repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and validate the exact Pterodactyl release
        run: bash tosios-builder/ci-build.sh

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: shring-shooter-siege-maps-v3.5.0
          path: |
            Shring-Shooter-Siege-Maps-v3.5.0-PTERODACTYL-FLAT.zip
            Shring-Shooter-Siege-Maps-v3.5.0-PTERODACTYL-FLAT.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish public GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.5.0
          name: Shring Shooter Siege Maps v3.5.0
          body: |
            Verified Siege Maps milestone built from the MIT-licensed TOSIOS foundation.

            New arenas:
            - Outbreak Citadel: courtyard, throne hall, armory breaches, forge holdout, and Royal Guard boss arena
            - Ashen Catacombs: central ossuary, four crypt wings, looping corridors, and Bone Colossus boss arena

            New encounter systems:
            - named zones synchronized to every client
            - authored team starts and opening armories
            - map-authored multi-front spawn gates
            - rewards delivered at the active holdout
            - boss-compatible routes and two-player runtime tests in both maps

            Also includes Hunter AI, Smooth Movement, the four-weapon Arsenal, Outbreak, private rooms, Deathmatch, and Team Deathmatch.

            Extract directly into `/home/container` and start with `bash ./start.sh`.
          files: |
            Shring-Shooter-Siege-Maps-v3.5.0-PTERODACTYL-FLAT.zip
            Shring-Shooter-Siege-Maps-v3.5.0-PTERODACTYL-FLAT.zip.sha256
          fail_on_unmatched_files: true
          make_latest: true
