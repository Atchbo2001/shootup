name: Build Shring Shooter Network Hardening

on:
  push:
    branches: [main]
    paths:
      - "tosios-builder/**"
      - ".github/workflows/build-tosios.yml"
      - "README.md"
      - "ROADMAP.md"
      - "VERSION-NEXT"
  pull_request:
    branches: [main]
    paths:
      - "tosios-builder/**"
      - ".github/workflows/build-tosios.yml"
      - "README.md"
      - "ROADMAP.md"
      - "VERSION-NEXT"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_COMMIT: 98de136e524d25c5877adc9523c9445bc2b4a262
  RELEASE_VERSION: 3.5.1
  ZIP_NAME: Shring-Shooter-Network-Hardening-v3.5.1-PTERODACTYL-FLAT.zip

jobs:
  build:
    name: Build, validate gameplay, reject hostile packets, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out Shring repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and validate the exact Pterodactyl release
        run: bash tosios-builder/ci-build-v3.5.1.sh

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: shring-shooter-network-hardening-v3.5.1
          path: |
            Shring-Shooter-Network-Hardening-v3.5.1-PTERODACTYL-FLAT.zip
            Shring-Shooter-Network-Hardening-v3.5.1-PTERODACTYL-FLAT.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish public GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.5.1
          name: Shring Shooter Network Hardening v3.5.1
          body: |
            Network-input hardening hotfix for Shring Shooter.

            Security and stability fixes:
            - validates move, rotate, shoot, reload, and revive packets before simulation
            - rejects malformed, missing, non-finite, zero-length, and oversized action values
            - normalizes valid angles and safely defaults invalid room options
            - sanitizes player and room labels
            - rate-limits gameplay actions per client
            - keeps defense-in-depth validation in the simulation queue
            - tests hostile packets against the exact packaged Pterodactyl runtime

            Retains Outbreak Citadel, Ashen Catacombs, named encounters, Hunter AI, Smooth Movement, the four-weapon Arsenal, private rooms, Deathmatch, and Team Deathmatch.

            Extract directly into `/home/container` and start with `bash ./start.sh`.
          files: |
            Shring-Shooter-Network-Hardening-v3.5.1-PTERODACTYL-FLAT.zip
            Shring-Shooter-Network-Hardening-v3.5.1-PTERODACTYL-FLAT.zip.sha256
          fail_on_unmatched_files: true
          make_latest: true
