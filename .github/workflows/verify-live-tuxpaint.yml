name: Verify Live Shring Tux Paint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-tuxpaint.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify public HTTPS health and original WASM assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://shootup.shring.net"
          for i in $(seq 1 25); do
            if curl -fSLSs --connect-timeout 5 --max-time 15 "$BASE/health" -o /tmp/tuxpaint-health.json; then break; fi
            echo "Waiting for Shootup to finish deployment ($i/25)"
            sleep 4
          done
          cat /tmp/tuxpaint-health.json
          grep -q '"ok":true' /tmp/tuxpaint-health.json
          grep -q '"app":"tuxpaint-original-wasm"' /tmp/tuxpaint-health.json
          curl -fSLSs --max-time 30 "$BASE/" -o /tmp/tuxpaint-live.html
          grep -q "Tux Paint" /tmp/tuxpaint-live.html
          for asset in tuxpaint.js tuxpaint.wasm tuxpaint.data; do
            echo "Checking $asset"
            curl -fSLSs --max-time 30 -I "$BASE/$asset" | grep -Ei '^HTTP/|^content-type:|^content-length:'
          done
          curl -fSLSs --max-time 30 -r 0-31 "$BASE/tuxpaint.wasm" -o /tmp/tuxpaint-32bytes
          test "$(wc -c < /tmp/tuxpaint-32bytes)" -eq 32
          echo "Live HTTPS, health, and WASM artifact check passed."
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install real browser smoke-test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Diagnose original Tux Paint startup in Chromium
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true, args:['--no-sandbox']});
          const page = await browser.newPage({viewport:{width:1366,height:900}});
          const messages=[];
          const put=(type,value)=>{messages.push({type,description:String(value).slice(0,1200)});console.log(type, String(value).slice(0,1200));};
          page.on('pageerror',e=>put('pageerror',e.stack||e.message));
          page.on('console',m=>put('console-'+m.type(),m.text()));
          page.on('requestfailed',r=>put('requestfailed',r.url()+' '+r.failure()?.errorText));
          page.on('response',r=>{if(r.status()>=400)put('http-'+r.status(),r.url());});
          try {
            const response=await page.goto('https://shootup.shring.net/',{waitUntil:'domcontentloaded',timeout:60000});
            if (!response?.ok()) throw new Error('HTTP '+response?.status());
            await page.waitForTimeout(10000);
            const details=await page.evaluate(()=>{
              const cv=document.querySelector('canvas.emscripten');
              const loading=document.getElementById('loading');
              const err=document.getElementById('error-msg');
              const stat=document.getElementById('status');
              const mod=window.Module;
              return {
                canvas:cv?{width:cv.width,height:cv.height,classes:cv.className,rect:{width:cv.getBoundingClientRect().width,height:cv.getBoundingClientRect().height}}:null,
                loading:loading?{classes:loading.className,text:loading.innerText}:null,
                error:err?{classes:err.className,text:err.innerText}:null,
                status:stat?.innerText,
                module:mod?{calledRun:mod.calledRun,ABORT:mod.ABORT,wasmMemory:!!mod.wasmMemory,FS:!!mod.FS,canvas:!!mod.canvas,exitStatus:mod.EXITSTATUS,postRun:mod.postRun?.length}:null,
                title:document.title,
                scripts:[...document.scripts].map(s=>s.src||'inline').slice(-8)
              };
            });
            console.log('DIAGNOSTICS:',JSON.stringify(details));
            console.log('CONSOLE:',JSON.stringify(messages.slice(-100)));
            await page.screenshot({path:'tuxpaint-live-verified.png',fullPage:true});
            const cv=details.canvas;
            if (!cv || cv.width<320 || cv.height<240) throw new Error('Tux Paint native canvas did not initialize: '+JSON.stringify(details));
            console.log('Live native canvas initialized:',JSON.stringify(cv));
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuxpaint-live-browser-screenshot
          path: tuxpaint-live-verified.png
          if-no-files-found: ignore
          retention-days: 7
