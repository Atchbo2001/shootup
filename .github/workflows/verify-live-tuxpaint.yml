name: Verify Live Shring Tux Paint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-tuxpaint.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify public HTTPS health and original WASM assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://shootup.shring.net"
          for i in $(seq 1 25); do
            if curl -fSLSs --connect-timeout 5 --max-time 15 "$BASE/health" -o /tmp/tuxpaint-health.json; then break; fi
            echo "Waiting for Shootup to finish deployment ($i/25)"
            sleep 4
          done
          cat /tmp/tuxpaint-health.json
          grep -q '"ok":true' /tmp/tuxpaint-health.json
          grep -q '"app":"tuxpaint-original-wasm"' /tmp/tuxpaint-health.json
          curl -fSLSs --max-time 30 "$BASE/" -o /tmp/tuxpaint-live.html
          grep -q "Tux Paint" /tmp/tuxpaint-live.html
          for asset in tuxpaint.js tuxpaint.wasm tuxpaint.data; do
            echo "Checking $asset"
            curl -fSLSs --max-time 30 -I "$BASE/$asset" | grep -Ei '^HTTP/|^content-type:|^content-length:'
          done
          WASM_LENGTH="$(curl -fSLSs --max-time 30 -I "$BASE/tuxpaint.wasm" | awk 'tolower($1)=="content-length:" {gsub("\\r","",$2); print $2}' | tail -1)"
          echo "Deployed WASM length: $WASM_LENGTH bytes"
          test "$WASM_LENGTH" -gt 250000
          curl -fSLSs --max-time 30 -r 0-31 "$BASE/tuxpaint.wasm" -o /tmp/tuxpaint-32bytes
          test "$(wc -c < /tmp/tuxpaint-32bytes)" -eq 32
          echo "Live HTTPS, health, and WASM artifact check passed."
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install real browser smoke-test runner
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Diagnose original Tux Paint startup in Chromium
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';
          const browser = await chromium.launch({headless:true, args:['--no-sandbox']});
          const page = await browser.newPage({viewport:{width:1366,height:900}});
          const messages=[];
          const put=(type,value)=>{messages.push({type,description:String(value).slice(0,1200)});console.log(type, String(value).slice(0,1200));};
          page.on('pageerror',e=>put('pageerror',e.stack||e.message));
          page.on('console',m=>put('console-'+m.type(),m.text()));
          page.on('requestfailed',r=>put('requestfailed',r.url()+' '+r.failure()?.errorText));
          page.on('response',r=>{if(r.status()>=400)put('http-'+r.status(),r.url());});
          try {
            const response=await page.goto('https://shootup.shring.net/',{waitUntil:'domcontentloaded',timeout:60000});
            if (!response?.ok()) throw new Error('HTTP '+response?.status());
            await page.waitForTimeout(10000);
            const splashShot=await page.screenshot({path:'tuxpaint-live-after-10s.png',fullPage:true});
            console.log('10s screenshot captured; waiting to confirm editor is shown, not just splash...');
            await page.waitForTimeout(45000);
            const lateShot=await page.screenshot({path:'tuxpaint-live-after-55s.png',fullPage:true});
            console.log('SCREENSHOT CHANGED FROM 10s TO 55s:',!splashShot.equals(lateShot));
            const details=await page.evaluate(()=>{
              const cv=document.querySelector('canvas.emscripten');
              const loading=document.getElementById('loading');
              const err=document.getElementById('error-msg');
              const stat=document.getElementById('status');
              const mod=window.Module;
              return {
                canvas:cv?{width:cv.width,height:cv.height,classes:cv.className,rect:{width:cv.getBoundingClientRect().width,height:cv.getBoundingClientRect().height}}:null,
                loading:loading?{classes:loading.className,text:loading.innerText}:null,
                error:err?{classes:err.className,text:err.innerText}:null,
                status:stat?.innerText,
                module:mod?{calledRun:mod.calledRun,ABORT:mod.ABORT,runtimeInitialized:mod.runtimeInitialized,wasmMemory:!!mod.wasmMemory,FS:!!mod.FS,main:typeof mod._main,callMain:typeof mod.callMain,wasmExports:Object.keys(mod).filter(k=>k.startsWith("_")).slice(0,20),root:mod.FS?.readdir("/"),data:mod.FS?.readdir("/data"),images:mod.FS?.readdir("/data/images")?.slice(0,12),sounds:mod.FS?.readdir("/data/sounds")?.slice(0,12),canvas:!!mod.canvas,exitStatus:mod.EXITSTATUS,postRun:mod.postRun?.length}:null,
                title:document.title,
                scripts:[...document.scripts].map(s=>s.src||'inline').slice(-8)
              };
            });
            console.log('DIAGNOSTICS:',JSON.stringify(details));
            console.log('CONSOLE:',JSON.stringify(messages.slice(-100)));
            await page.screenshot({path:'tuxpaint-live-verified.png',fullPage:true});
            const cv=details.canvas;
            if (!cv || cv.width<640 || cv.height<400 || cv.rect.width<400 || (details.error?.text||'').trim()) throw new Error('Tux Paint did not render a usable native canvas: '+JSON.stringify(details));
            const output=messages.map(m=>m.description||'');
            if(!output.some(s=>s.includes('[TPTRACE] EDITOR_READY')))
              throw Error('Native Tux Paint editor did not finish initializing: '+JSON.stringify(output.slice(-40)));
            if((details.module?.images||[]).length<8 || (details.module?.sounds||[]).length<8)
              throw Error('Native Tux Paint data files unavailable: '+JSON.stringify(details.module));
            const el=page.locator('canvas.emscripten');
            const rect=await el.boundingBox();
            if(!rect) throw Error('No visible drawing canvas bounds');
            const base=PNG.sync.read(await el.screenshot());
            const x=rect.x+rect.width*0.46;
            const y=rect.y+rect.height*0.48;
            await page.mouse.move(x,y);
            await page.mouse.down();
            await page.mouse.move(x+100,y+60,{steps:24});
            await page.mouse.up();
            await page.waitForTimeout(700);
            const next=PNG.sync.read(await el.screenshot());
            let count=0;
            for(let i=0;i<base.data.length;i+=4)
              if(Math.abs(base.data[i]-next.data[i])+Math.abs(base.data[i+1]-next.data[i+1])+Math.abs(base.data[i+2]-next.data[i+2])>80) count++;
            console.log('LIVE DRAWING MODIFIED PIXELS:',count);
            if(count<150) throw Error('Canvas did not respond to brush stroke');
            await page.screenshot({path:'tuxpaint-live-after-paint.png',fullPage:true});
            console.log('Live original Tux Paint editor initialized, drawing works:',JSON.stringify(cv));
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuxpaint-live-browser-screenshot
          path: |
            tuxpaint-live-verified.png
            tuxpaint-live-after-10s.png
            tuxpaint-live-after-55s.png
            tuxpaint-live-after-paint.png
          if-no-files-found: ignore
          retention-days: 7
