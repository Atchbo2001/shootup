name: Build Shring Outbreak Pterodactyl ZIP

on:
  push:
    branches:
      - main
    paths:
      - "builder/**"
      - "runtime/**"
      - ".github/workflows/build-pterodactyl.yml"
  pull_request:
    branches:
      - main
    paths:
      - "builder/**"
      - "runtime/**"
      - ".github/workflows/build-pterodactyl.yml"
      - "BUILD_TRIGGER"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_COMMIT: 85df5067b19a876cac4304232cc1e68ff1b07c7f
  RELEASE_VERSION: 1.1.2
  PUBLIC_URL: https://shootup.shring.net

jobs:
  build:
    name: Build, smoke test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build verified package
        shell: bash
        run: bash builder/build.sh

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: shring-outbreak-pterodactyl-v1.1.2
          path: |
            Shring-Outbreak-Suroi-v1.1.2-PREBUILT-FLAT.zip
            Shring-Outbreak-Suroi-v1.1.2-PREBUILT-FLAT.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish public GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: Shring Outbreak v1.1.2
          body: |
            Precompiled flat Pterodactyl deployment for shootup.shring.net.

            Menu cleanup:
            - centered main play panel
            - removed marquee text and featured creator panels
            - removed Wiki, Donate, Discord, and other Suroi social links
            - replaced inactive team controls with one clear Play button
            - corrected the Shring Network region label
            - suppressed harmless browser-aborted stream warnings

            Extract directly into /home/container and start with:

            bash ./start.sh

            Guest play is enabled and no account is required.
          files: |
            Shring-Outbreak-Suroi-v1.1.2-PREBUILT-FLAT.zip
            Shring-Outbreak-Suroi-v1.1.2-PREBUILT-FLAT.zip.sha256
          fail_on_unmatched_files: true
          make_latest: true
