name: Build Shring Outbreak Pterodactyl ZIP

on:
  push:
    branches:
      - main
    paths:
      - "builder/**"
      - "runtime/**"
      - ".github/workflows/build-pterodactyl.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: 85df5067b19a876cac4304232cc1e68ff1b07c7f
  RELEASE_VERSION: 1.1.1
  PUBLIC_URL: https://shootup.shring.net

jobs:
  build:
    name: Build, smoke test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build verified package
        shell: bash
        run: bash builder/build.sh

      - name: Upload Pterodactyl artifact
        uses: actions/upload-artifact@v4
        with:
          name: shring-outbreak-pterodactyl-v1.1.1
          path: |
            Shring-Outbreak-Suroi-v1.1.1-PREBUILT-FLAT.zip
            Shring-Outbreak-Suroi-v1.1.1-PREBUILT-FLAT.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
